# Tests, exports and releases of the native game (godot/).
# Every push and pull request: the simulation's tests, then the Linux and Windows exports,
# kept as the run's artifacts, with an AppImage for Linux and an installer for Windows. Then
# all of them are published:
# - a push on main or dev replaces that branch's pre-release (main-build, dev-build), whose
#   files keep the same names, so the same download addresses, from one commit to the next;
# - a tag vX.Y.Z makes the version's release, once the version in the game matches the tag,
#   and goes to itch.io if the repository names the game there (see the itch job).
# Before anything is published, both exports are started without a window, each on its system,
# and so are the AppImage and the game as the installer installs it.
# The online server on its own (godot/Relay) is built, started and published beside them.
# Pull requests publish nothing. Actions are pinned to their commits, downloads to their hashes.
name: Build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GODOT_VERSION: "4.7.2"
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    name: Tests de la simulation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Tests
        run: dotnet test godot/Sim.Tests -c Release
      # Every text the code shows has its English in godot/Game/lang/en.po.
      - name: Traduction
        run: python3 godot/tools/lang.py --check

  export:
    name: Exports Linux et Windows
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version du jeu et tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          ok=1
          grep -qx "config/version=\"$v\"" godot/Game/project.godot || { echo "::error file=godot/Game/project.godot::config/version n'est pas $v"; ok=0; }
          grep -q "Version = \"$v\";" godot/Game/scripts/Ui/Menu.cs || { echo "::error file=godot/Game/scripts/Ui/Menu.cs::Menu.Version n'est pas $v"; ok=0; }
          grep -qx "application/product_version=\"$v.0\"" godot/Game/export_presets.cfg || { echo "::error file=godot/Game/export_presets.cfg::product_version n'est pas $v.0"; ok=0; }
          [ "$ok" = 1 ]

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache de Godot
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-templates

      # The official archives, checked against the SHA-512 sums Godot publishes with the release.
      # Only the templates the two presets use are kept: the whole set weighs about a gigabyte.
      - name: Godot et ses modèles d'export
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          mkdir -p ~/godot/templates && cd ~/godot
          curl -fsSL --retry 3 -o "$editor" "$base/$editor"
          curl -fsSL --retry 3 -o "$templates" "$base/$templates"
          sha512sum -c - <<EOF
          1855960b27ee3ef5e66e5e228cced69d55637b24334a7411162687dcd077d8f9f645348cdb8eae984bec8135d49ed855a1e3a16476786b8bce60774fd8402d13  $editor
          bb5c41d72370ed743660361f6228006f808ab04ca33abdc545d740b044f3fe057f32ae8cb7873a1bc86ddcd82ae683b9f6dfdfe4179852f2c0f1acde2ff6bd5a  $templates
          EOF
          unzip -q "$editor"
          unzip -q -j "$templates" templates/version.txt templates/icudt_godot.dat \
            templates/linux_release.x86_64 templates/windows_release_x86_64.exe -d templates
          rm "$editor" "$templates"

      - name: Installation de Godot
        run: |
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$dir"
          cp ~/godot/templates/* "$dir/"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import du projet
        working-directory: godot/Game
        run: '"$GODOT" --headless --import'

      - name: Exports
        working-directory: godot/Game
        run: |
          # Godot does not make the folder it exports into.
          mkdir -p ../build/linux ../build/windows
          "$GODOT" --headless --export-release "Linux" ../build/linux/SandboxShip.x86_64
          "$GODOT" --headless --export-release "Windows" ../build/windows/SandboxShip.exe
          test -x ../build/linux/SandboxShip.x86_64 && test -d ../build/linux/data_Game_linuxbsd_x86_64
          test -f ../build/windows/SandboxShip.exe && test -d ../build/windows/data_Game_windows_x86_64

      # The export starts, without a window: a battle and the campaign play a few hundred
      # frames each, then it quits by itself. "Capture" in its log says it got that far.
      - name: Démarrage de l'export Linux
        working-directory: godot/build/linux
        run: |
          for start in battle campaign; do
            timeout 300 ./SandboxShip.x86_64 --headless --log-file "$RUNNER_TEMP/smoke-$start.log" -- --start=$start --shot="$RUNNER_TEMP/smoke.png" --frames=300
            grep -q "^Capture" "$RUNNER_TEMP/smoke-$start.log" || { cat "$RUNNER_TEMP/smoke-$start.log"; echo "::error::l'export Linux n'a pas tenu jusqu'au bout ($start)"; exit 1; }
          done

      # The main screens played in English: the texts made at run time with no English yet are
      # listed as warnings; the release goes on.
      - name: Traduction en jeu
        continue-on-error: true
        run: |
          godot/tools/lang-check.sh godot/build/linux/SandboxShip.x86_64 "$RUNNER_TEMP/lang-missing.txt" \
            || { sed 's/^/::warning::sans anglais : /' "$RUNNER_TEMP/lang-missing.txt" | head -50; exit 1; }

      # Each archive holds one folder, the executable and its data next to it; the Linux one
      # also serves a dedicated or online server (the Pelican egg takes it as it is).
      - name: Archives
        working-directory: godot/build
        run: |
          # The tag, the branch for main and dev (the names their pre-releases keep), else the commit.
          case "$GITHUB_REF" in
            refs/tags/v*|refs/heads/main|refs/heads/dev) v="$GITHUB_REF_NAME" ;;
            *) v="build-${GITHUB_SHA::7}" ;;
          esac
          echo "BUILD_NAME=$v" >> "$GITHUB_ENV"
          mkdir -p ../../dist
          mv linux "SandboxShip-$v-linux-x86_64"
          tar -czf "../../dist/SandboxShip-$v-linux-x86_64.tar.gz" "SandboxShip-$v-linux-x86_64"
          mv windows "SandboxShip-$v-windows-x86_64"
          zip -qr "../../dist/SandboxShip-$v-windows-x86_64.zip" "SandboxShip-$v-windows-x86_64"
          ls -l ../../dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-ship
          path: dist/*
          if-no-files-found: error

      # The Linux export as an AppImage too (godot/packaging/appimage.sh), by appimagetool and the
      # AppImage runtime at a version and a hash of their own, never whatever "continuous" is that day.
      - name: AppImage
        working-directory: godot/build
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/runtime" https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c - <<EOF
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/runtime
          EOF
          chmod +x "$RUNNER_TEMP/appimagetool"
          mkdir -p ../../dist-appimage
          ../packaging/appimage.sh "SandboxShip-$BUILD_NAME-linux-x86_64" "../../dist-appimage/SandboxShip-$BUILD_NAME-linux-x86_64.AppImage" \
            "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/runtime"

      # The AppImage starts a battle as the export did. It unpacks itself to run: FUSE, which
      # mounts it on a player's machine, is not certain on the runner.
      - name: Démarrage de l'AppImage
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 300 "dist-appimage/SandboxShip-$BUILD_NAME-linux-x86_64.AppImage" \
            --headless --log-file "$RUNNER_TEMP/smoke-appimage.log" -- --start=battle --shot="$RUNNER_TEMP/smoke.png" --frames=300
          grep -q "^Capture" "$RUNNER_TEMP/smoke-appimage.log" || { cat "$RUNNER_TEMP/smoke-appimage.log"; echo "::error::l'AppImage n'a pas tenu jusqu'au bout"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-ship-appimage
          path: dist-appimage/*
          if-no-files-found: error

  # The online server on its own (godot/Relay): its ENet built from its pinned source, then the
  # program; it must start, and stop on SIGTERM as a panel stops it, before it is published.
  relay:
    name: Serveur en ligne léger
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: ENet
        run: godot/Relay/native/build.sh
      - name: Programme
        run: |
          # Named as the game's archives are: the tag, the branch for main and dev, else the commit.
          case "$GITHUB_REF" in
            refs/tags/v*|refs/heads/main|refs/heads/dev) v="$GITHUB_REF_NAME" ;;
            *) v="build-${GITHUB_SHA::7}" ;;
          esac
          echo "RELAY_DIR=SandboxShip-relay-$v-linux-x86_64" >> "$GITHUB_ENV"
          dotnet publish godot/Relay -c Release -p:RestoreLockedMode=true -p:InformationalVersion="$v" -o "build/SandboxShip-relay-$v-linux-x86_64"
      - name: Démarrage et arrêt
        working-directory: build/${{ env.RELAY_DIR }}
        run: |
          ./sandbox-ship-relay --port=27031 > "$RUNNER_TEMP/relay.log" 2>&1 &
          pid=$!
          for i in $(seq 1 50); do grep -q "à l'écoute sur le port 27031" "$RUNNER_TEMP/relay.log" && break; sleep 0.1; done
          grep -q "à l'écoute sur le port 27031" "$RUNNER_TEMP/relay.log" || { cat "$RUNNER_TEMP/relay.log"; echo "::error::le serveur en ligne ne démarre pas"; exit 1; }
          kill -TERM "$pid"
          code=0; wait "$pid" || code=$?
          cat "$RUNNER_TEMP/relay.log"
          [ "$code" = 0 ] && grep -q "Arrêté" "$RUNNER_TEMP/relay.log"
      - name: Archive
        run: mkdir -p dist && tar -czf "dist/$RELAY_DIR.tar.gz" -C build "$RELAY_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-ship-relay
          path: dist/*
          if-no-files-found: error

  # The Windows export, started on Windows itself, as the Linux one above; then its installer,
  # made, installed and started there too.
  smoke-windows:
    name: Export Windows, démarrage et installeur
    needs: export
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: godot/packaging
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sandbox-ship
          path: dist
      - name: Bataille et campagne sans fenêtre
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "*-windows-x86_64.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath game
          $exe = Get-ChildItem game -Recurse -Filter SandboxShip.exe | Select-Object -First 1
          foreach ($start in "battle", "campaign") {
            $log = Join-Path $env:RUNNER_TEMP "smoke-$start.log"
            $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -Wait -PassThru `
              -ArgumentList "--headless", "--log-file", "`"$log`"", "--", "--start=$start", "--shot=smoke.png", "--frames=300"
            if (-not (Select-String -Path $log -Pattern "^Capture" -Quiet)) {
              Get-Content $log
              Write-Error "l'export Windows n'a pas tenu jusqu'au bout ($start, code $($p.ExitCode))"
              exit 1
            }
          }

      # Inno Setup makes the installer (godot/packaging/SandboxShip.iss): it installs for the player
      # alone, with no administrator rights, and is a Windows program, made and tried on the same
      # machine. Its own setup at a version and a hash of its own, installed in the runner's temp.
      - name: Installeur
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732") {
            Write-Error "Inno Setup n'a pas l'empreinte attendue"
            exit 1
          }
          $inno = Join-Path $env:RUNNER_TEMP "inno"
          Start-Process $setup -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$inno`""
          # The archive unpacked again: the folder started above holds the capture it took.
          $zip = Get-ChildItem dist -Filter "*-windows-x86_64.zip" | Select-Object -First 1
          $v = $zip.Name -replace '^SandboxShip-(.+)-windows-x86_64\.zip$', '$1'
          Expand-Archive $zip.FullName -DestinationPath installer-source
          $source = (Get-ChildItem installer-source -Directory | Select-Object -First 1).FullName
          $out = (New-Item -ItemType Directory -Force dist-installer).FullName
          & (Join-Path $inno "ISCC.exe") /Q "/DVersion=$v" "/DSource=$source" "/O$out" godot\packaging\SandboxShip.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist-installer

      # The installer installs in silence; the game it installed starts a battle as the export did,
      # then the uninstaller takes it away and keeps the player's files.
      - name: Installation, démarrage et désinstallation
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-installer -Filter "*-setup.exe" | Select-Object -First 1
          $installLog = Join-Path $env:RUNNER_TEMP "install.log"
          $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=`"$installLog`""
          $app = Join-Path $env:LOCALAPPDATA "Programs\Sandbox Ship"
          $exe = Join-Path $app "SandboxShip.exe"
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Sandbox Ship.lnk"
          if ($p.ExitCode -ne 0 -or -not (Test-Path $exe) -or -not (Test-Path $shortcut)) {
            Get-Content $installLog
            Write-Error "l'installation n'est pas complète (code $($p.ExitCode))"
            exit 1
          }
          $log = Join-Path $env:RUNNER_TEMP "smoke-installed.log"
          $shot = Join-Path $env:RUNNER_TEMP "smoke-installed.png"
          $g = Start-Process -FilePath $exe -WorkingDirectory $app -Wait -PassThru `
            -ArgumentList "--headless", "--log-file", "`"$log`"", "--", "--start=battle", "--shot=`"$shot`"", "--frames=300"
          if (-not (Select-String -Path $log -Pattern "^Capture" -Quiet)) {
            Get-Content $log
            Write-Error "le jeu installé n'a pas tenu jusqu'au bout (code $($g.ExitCode))"
            exit 1
          }
          # A file of the player's: the uninstall must leave it where it is.
          $saves = Join-Path $env:APPDATA "Godot\app_userdata\Sandbox Ship"
          New-Item -ItemType Directory -Force $saves | Out-Null
          $kept = Join-Path $saves "uninstall-keeps-this.txt"
          Set-Content $kept "x"
          Start-Process (Join-Path $app "unins000.exe") -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          # The uninstaller goes on from a copy of itself: it is done once the game's folder is gone.
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if ((Test-Path $app) -or (Test-Path $shortcut)) {
            if (Test-Path $app) { Get-ChildItem $app -Recurse | Select-Object -First 20 }
            Write-Error "la désinstallation n'est pas complète"
            exit 1
          }
          if (-not (Test-Path $kept)) {
            Write-Error "la désinstallation a effacé les fichiers du joueur"
            exit 1
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-ship-installer
          path: dist-installer/*
          if-no-files-found: error

  release:
    name: Publication
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: [export, smoke-windows, relay]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The game's archives, its AppImage and installer, and the online server's archive, side by side.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sandbox-ship*
          merge-multiple: true
          path: dist
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Sandbox Ship $GITHUB_REF_NAME" --generate-notes \
              || gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          # The branch's pre-release, made again on this commit: its tag moves with it. A tag
          # pushed with this token starts no workflow, and these do not match v* anyway.
          tag="$GITHUB_REF_NAME-build"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Sandbox Ship, build de $GITHUB_REF_NAME" \
            --notes "Build automatique de \`$GITHUB_REF_NAME\` au commit ${GITHUB_SHA::7}, refait à chaque push sur cette branche. Les versions publiées sont les releases vX.Y.Z."

  # A version also goes to itch.io, once the game's page is named in the repository's variable
  # ITCH_GAME ("user/game") and butler's key is in the secret BUTLER_API_KEY. Without them,
  # nothing happens.
  itch:
    name: Publication sur itch.io
    if: startsWith(github.ref, 'refs/tags/v') && vars.ITCH_GAME != ''
    needs: [export, smoke-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sandbox-ship
          path: dist
      - name: butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "::warning::secret BUTLER_API_KEY absent : rien n'est envoyé sur itch.io"; exit 0; fi
          # butler at a version and a hash of its own, never whatever LATEST is that day.
          curl -fsSL --retry 3 -o butler.zip https://broth.itch.zone/butler/linux-amd64/15.32.0/archive/default
          echo "2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5  butler.zip" | sha256sum -c --quiet -
          unzip -q butler.zip -d butler && chmod +x butler/butler
          mkdir -p linux windows
          tar -xzf dist/*-linux-x86_64.tar.gz -C linux --strip-components=1
          unzip -q dist/*-windows-x86_64.zip -d windows-zip && mv windows-zip/*/* windows/
          v="${GITHUB_REF_NAME#v}"
          ./butler/butler push linux "$ITCH_GAME:linux" --userversion "$v"
          ./butler/butler push windows "$ITCH_GAME:windows" --userversion "$v"
